services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tp
      POSTGRES_PASSWORD: tp
      POSTGRES_DB: takepicker
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB"]
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    deploy:
      resources:
        limits:
          memory: 96M

  analysis:
    build: ./apps/analysis
    environment:
      WHISPER_MODEL: base          # base uses ~400MB less RAM than small
    volumes: [media:/media]
    ports: ["8000:8000"]
    deploy:
      resources:
        limits:
          memory: 1536M            # Whisper base + MiniLM fits in 1.5GB

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://tp:tp@postgres:5432/takepicker
      MEDIA_DIR: /media
      NODE_OPTIONS: "--max-old-space-size=256"
    ports: ["3000:3000"]
    depends_on: [redis, postgres]
    volumes: [media:/media]
    deploy:
      resources:
        limits:
          memory: 384M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3000
      PORT: 3001
      NODE_OPTIONS: "--max-old-space-size=256"
    ports: ["3001:3001"]
    depends_on: [api]
    deploy:
      resources:
        limits:
          memory: 384M

  ingest-worker:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    command: ["node", "dist/apps/workers/src/ingest.js"]
    environment: &worker_env
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://tp:tp@postgres:5432/takepicker
      MEDIA_DIR: /media
      ANALYSIS_URL: http://analysis:8000
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on: [redis, postgres]
    volumes: [media:/media]
    deploy:
      resources:
        limits:
          memory: 512M

  render-worker:            # scale me: --scale render-worker=N
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    command: ["node", "dist/apps/workers/src/render.js"]
    environment:
      <<: *worker_env
      FFMPEG_THREADS: "1"          # 1 thread per worker saves RAM on 8GB systems
    depends_on: [redis, postgres]
    volumes: [media:/media]
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  media:
