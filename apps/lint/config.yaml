# Video Linter Detection Thresholds
# Calibrated for talking-head content and lossy H.264 compression

black_frames:
  pic_th: 0.98          # pixel threshold: fraction of pixels that must be black
  min_duration: 0.1     # minimum black span (seconds) to flag

frozen_video:
  noise_db: -35         # freezedetect noise floor (-35dB accounts for H.264 compression artifacts)
  min_duration: 0.5     # minimum freeze span (seconds) to flag

audio_dropout:
  noise_db: -45         # silencedetect noise floor
  min_duration: 0.5     # minimum silence span (seconds) to flag true dropout (vs natural pause)
  require_speech_context: true  # only flag if inside a speech span

loudness_jump:
  window_sec: 1.0       # sliding window for momentary loudness
  threshold_lu: 8.0     # flag if adjacent windows differ by more than this (LUFS)

av_desync:
  max_offset_ms: 500    # maximum lag to search
  min_detectable_ms: 80 # offsets below this are unreliable

click_pop:
  window_ms: 10         # analysis window around join points
  energy_ratio: 3.0     # flag if high-freq energy ratio exceeds this

word_cutoff:
  boundary_tolerance_ms: 50  # a word is "cut" if boundary is > this far inside it
