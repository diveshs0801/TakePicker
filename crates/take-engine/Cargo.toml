[package]
name = "take-engine"
version = "0.1.0"
edition = "2021"
authors = ["TakePicker Core Team"]
description = "High-performance native audio/video engine for TakePicker: SIMD waveform peaks, VAD silence scanner, and smart GOP stream splicer."

[lib]
name = "take_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "take-engine"
path = "src/bin/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
